<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Deep Space Ultimate Portal - 1 File Only</title>
    <style>
        /* --- KHU VỰC CSS: THIẾT KẾ GIAO DIỆN --- */
        :root {
            --bg-main: #05050e;
            --bg-card: rgba(15, 20, 45, 0.6);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --nasa-blue: #0b3d91;
            --nasa-red: #fc3d21;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #cbd5e1;
        }

        * { 
            box-sizing: border-box; 
            transition: all 0.2s ease; 
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        /* Canvas tạo hiệu ứng không gian tương tác */
        #space-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: auto;
        }

        .navbar {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
        }

        .nav-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            max-width: 1300px; 
            margin: 0 auto; 
        }

        .logo { 
            font-size: 1.4rem; 
            font-weight: bold; 
            display: flex; 
            gap: 8px; 
        }

        .nav-controls {
            display: flex;
            gap: 10px;
        }

        .theme-btn { 
            background: transparent; 
            border: 1px solid var(--border-color); 
            color: var(--text-primary); 
            padding: 8px 16px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: 600;
        }

        .sound-off {
            border-color: rgba(255, 255, 255, 0.3) !important;
            opacity: 0.6;
        }

        .sound-on {
            border-color: #4ade80 !important;
            color: #4ade80 !important;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
            opacity: 1;
        }

        /* Trình mô phỏng bảng tính ảnh hưởng sinh học */
        .interactive-calc-section {
            max-width: 1300px; 
            margin: 30px auto; 
            padding: 0 20px;
        }

        .calc-container {
            background: linear-gradient(135deg, rgba(11, 61, 145, 0.2), rgba(252, 61, 33, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px; 
            border-radius: 16px; 
            backdrop-filter: blur(10px);
        }

        .calc-inputs { 
            display: flex; 
            gap: 15px; 
            margin: 20px 0; 
        }

        .calc-inputs input {
            padding: 12px; 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border-color); 
            color: #fff; 
            border-radius: 8px; 
            font-size: 1.1rem; 
            width: 120px;
        }

        .calc-inputs button {
            background: var(--nasa-red); 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
        }

        .calc-inputs button:hover { 
            transform: scale(1.03); 
            background: #cc331a; 
        }

        .calc-results {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            background: rgba(0,0,0,0.2); 
            padding: 20px; 
            border-radius: 10px;
        }

        .res-item strong { 
            font-size: 1.25rem; 
            color: #38bdf8; 
        }

        .status-safe { 
            color: #4ade80; 
            font-weight: bold; 
        }

        .status-danger { 
            color: #f87171; 
            font-weight: bold; 
            animation: pulse 1s infinite alternate; 
        }

        @keyframes pulse { 
            from { opacity: 0.6; } 
            to { opacity: 1; } 
        }

        /* Thanh tìm kiếm và bộ lọc */
        .control-panel { 
            max-width: 1300px; 
            margin: 20px auto; 
            padding: 0 20px; 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: space-between; 
            gap: 15px; 
        }

        .search-box input { 
            width: 320px; 
            padding: 12px; 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            color: var(--text-primary); 
        }

        .filter-btn { 
            background: var(--bg-card); 
            color: var(--text-primary); 
            border: 1px solid var(--border-color); 
            padding: 10px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600;
        }

        .filter-btn.active, .filter-btn:hover { 
            background: var(--nasa-blue); 
            color: white; 
            border-color: var(--nasa-blue); 
        }

        /* Lưới hiển thị danh sách các thẻ rủi ro */
        .main-content { 
            max-width: 1300px; 
            margin: 30px auto; 
            padding: 0 20px; 
        }

        .grid-layout { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px; 
        }

        .info-card {
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 20px; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            position: relative;
        }

        .info-card:hover { 
            transform: translateY(-4px); 
            border-color: var(--nasa-blue); 
            box-shadow: 0 8px 16px rgba(11, 61, 145, 0.2);
        }

        .info-card h3 { 
            margin: 8px 0; 
            font-size: 1.15rem; 
        }

        .info-card p { 
            color: var(--text-secondary); 
            font-size: 0.9rem; 
            line-height: 1.5; 
            flex-grow: 1; 
        }

        .card-actions {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 15px; 
            padding-top: 15px; 
            border-top: 1px solid var(--border-color);
        }

        .vote-btn {
            background: rgba(255, 255, 255, 0.08); 
            border: none; 
            padding: 6px 12px; 
            border-radius: 6px; 
            color: var(--text-primary); 
            cursor: pointer; 
            display: flex; 
            gap: 5px; 
            align-items: center;
            font-weight: 600;
        }

        .vote-btn:hover { 
            background: rgba(252, 61, 33, 0.2); 
            color: var(--nasa-red); 
        }

        /* Hộp thoại Pop-up Window (Modal) */
        .modal-overlay { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); 
            backdrop-filter: blur(8px); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
        }

        .modal-content { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            color: var(--text-primary); 
            width: 90%; 
            max-width: 600px; 
            padding: 35px; 
            border-radius: 16px; 
            position: relative; 
        }

        .close-modal-btn { 
            position: absolute; 
            top: 15px; right: 20px; 
            font-size: 2rem; 
            background: transparent; 
            border: none; 
            color: var(--text-primary); 
            cursor: pointer; 
        }

        .modal-tag {
            font-size: 0.8rem;
            background: var(--nasa-blue);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .hidden { 
            display: none !important; 
        }
    </style>
</head>
<body>

    <!-- Canvas sinh hạt tương tác -->
    <canvas id="space-canvas"></canvas>

    <!-- Thanh điều hướng -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">🚀 <span>NASA Deep Space Hub</span></div>
            <div class="nav-controls">
                <button id="sound-ambient-btn" class="theme-btn sound-off">🎵 Bật âm thanh trạm ISS</button>
                <button id="theme-toggle" class="theme-btn">🌙 Chế độ nền</button>
            </div>
        </div>
    </nav>

    <!-- Trình mô phỏng ảnh hưởng sinh học -->
    <section class="interactive-calc-section">
        <div class="calc-container">
            <h2>📊 TRÌNH MÔ PHỎNG ẢNH HƯỞNG SỨC KHỎE (MISSION CALCULATOR)</h2>
            <p>Nhập số tháng bạn dự định du hành ngoài không gian sâu để tính toán tổn thương cơ thể:</p>
            <div class="calc-inputs">
                <input type="number" id="mission-months" min="1" max="120" value="6">
                <button id="btn-calculate">Kích hoạt mô phỏng</button>
            </div>
            <div class="calc-results" id="calc-results-box">
