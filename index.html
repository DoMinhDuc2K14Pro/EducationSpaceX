<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Deep Space Solutions Control Matrix</title>
    <style>
        :root {
            --bg-dark: #030712;
            --bg-panel: rgba(17, 24, 39, 0.85);
            --text-glow: #38bdf8;
            --text-sub: #9ca3af;
            --nasa-red: #fc3d21;
            --border-neon: rgba(56, 189, 248, 0.2);
            --border-hover: rgba(252, 61, 33, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            padding: 30px 20px;
            background-image: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
        }

        header {
            text-align: center;
            max-width: 1200px;
            margin: 0 auto 40px auto;
            border-bottom: 2px solid rgba(56, 189, 248, 0.1);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            margin-bottom: 10px;
        }

        header h1 span {
            color: var(--nasa-red);
        }

        header p {
            color: var(--text-sub);
            font-size: 1.05rem;
        }

        /* Thanh điều khiển Tìm kiếm & Thống kê nhanh */
        .dashboard-controls {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .search-container input {
            width: 350px;
            padding: 14px 20px;
            background: var(--bg-panel);
            border: 1px solid var(--border-neon);
            border-radius: 30px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.05);
        }

        .search-container input:focus {
            border-color: var(--text-glow);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .counter-badge {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--text-glow);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* Lưới hiển thị giải pháp */
        .solutions-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 25px;
        }

        .solution-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-neon);
            border-radius: 14px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .solution-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            box-shadow: 0 10px 25px rgba(252, 61, 33, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .tech-id {
            font-size: 0.8rem;
            font-weight: bold;
            background: rgba(252, 61, 33, 0.1);
            color: var(--nasa-red);
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .category-tag {
            font-size: 0.75rem;
            font-weight: bold;
            background: rgba(56, 189, 248, 0.15);
            color: var(--text-glow);
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .solution-card h3 {
            font-size: 1.25rem;
            color: #ffffff;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .problem-reference {
            font-size: 0.85rem;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.08);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 3px solid #fbbf24;
        }

        .solution-details {
            font-size: 0.95rem;
            color: #e5e7eb;
            line-height: 1.6;
            flex-grow: 1;
        }

        .action-area {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #4ade80;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
        }

        .deploy-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .deploy-btn:hover {
            background: #ffffff;
            color: var(--bg-dark);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            .search-container input { width: 100%; }
            .dashboard-controls { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <header>
        <h1>MA TRẬN GIẢI PHÁP KHÔNG GIAN SÂU CỦA <span>NASA</span></h1>
        <p>Hệ thống công nghệ ứng phó và bảo vệ phi hành đoàn trước 14 rủi ro sinh học cốt lõi</p>
    </header>

    <section class="dashboard-controls">
        <div class="search-container">
            <input type="text" id="solution-search" placeholder="🔍 Tìm kiếm giải pháp, thiết bị, từ khóa...">
        </div>
        <div class="counter-badge">
            🚀 Đang hiển thị: <span id="visible-count">14</span> / 14 Giải pháp chiến lược
        </div>
    </section>

    <main class="solutions-grid" id="solutions-display-matrix">
        <!-- Render động từ Javascript -->
    </main>
